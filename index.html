<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Workout Tracker</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="stylesheet" href="style.css" />
    <script>
      /* apply the saved theme before first paint so the page never flashes the wrong one */
      try {
        const t = localStorage.getItem("workout-tracker-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="hdr">
      <div class="crumbs">
        <img class="hdr-logo" src="icon.png" alt="" width="28" height="28" />
        <span class="crumb" id="crumb-page">Log</span>
      </div>
      <div class="hdr-right">
        <span id="hdr-timer"></span>
        <button type="button" class="iconbtn" id="kbd-help" title="Keyboard shortcuts (?)"
          aria-label="Keyboard shortcuts">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="4" width="13" height="8.5" rx="1.5" /><path d="M4 6.5h.01M6.5 6.5h.01M9 6.5h.01M11.5 6.5h.01M4 9h.01M11.5 9h.01M6 9.8h4" /></svg>
        </button>
        <div class="menu-wrap">
          <button type="button" class="iconbtn" id="theme-btn" title="Theme" aria-label="Theme"
            aria-haspopup="menu" aria-expanded="false"></button>
          <div class="menu" id="theme-menu" role="menu" hidden>
            <button type="button" role="menuitemradio" data-theme-choice="os">
              <svg class="chk" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" /></svg>
              <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6" /><path d="M8 2a6 6 0 0 0 0 12z" fill="currentColor" /></svg>
              OS mode
            </button>
            <button type="button" role="menuitemradio" data-theme-choice="light">
              <svg class="chk" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" /></svg>
              <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.8" /><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" /></svg>
              Light
            </button>
            <button type="button" role="menuitemradio" data-theme-choice="dark">
              <svg class="chk" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" /></svg>
              <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 9.6A5.8 5.8 0 1 1 6.4 2.5a4.6 4.6 0 0 0 7.1 7.1z" /></svg>
              Dark
            </button>
          </div>
        </div>
        <!-- Settings is a page, not a tab: exercise levels, data on this device, about -->
        <button type="button" class="iconbtn" id="settings-btn" title="Settings (,)"
          aria-label="Settings">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
        </button>
      </div>
    </header>
    <main class="main">
      <div class="page-head">
        <div class="page-icon" id="page-icon" aria-hidden="true"></div>
        <div class="page-head-text">
          <h1 class="page-title" id="page-title">Log</h1>
          <p class="page-sub" id="page-sub"></p>
        </div>
      </div>
      <div class="tabbar">
        <!-- bottom tab bar on phones, left rail from 900px; line icons: patterns.md §11 -->
        <nav class="tabs" aria-label="Tabs">
          <button class="tab on" data-t="log" title="Log (1)">
            <span class="tab-ic">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" />
                <path d="M3.5 9.5h17M8 3v3.5M16 3v3.5M8 13.5h3M8 17h6" />
              </svg>
            </span>
            <span class="tab-tx">Log</span>
          </button>
          <button class="tab" data-t="plan" title="Plan (2)">
            <span class="tab-ic">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="4" width="16" height="16" rx="3" />
                <path d="M8 9h8M8 12.5h8M8 16h5" />
              </svg>
            </span>
            <span class="tab-tx">Plan</span>
          </button>
          <button class="tab" data-t="workout" title="Workout (3)">
            <span class="tab-ic">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12h2.5M8.5 12h7M18.5 12H21" />
                <rect x="5.5" y="6.5" width="3" height="11" rx="1.2" />
                <rect x="15.5" y="6.5" width="3" height="11" rx="1.2" />
              </svg>
            </span>
            <span class="tab-tx">Workout</span>
          </button>
          <button class="tab" data-t="personal" title="Personal (4)">
            <span class="tab-ic">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="7.5" r="3.5" />
                <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6" />
              </svg>
            </span>
            <span class="tab-tx">Personal</span>
          </button>
          <button class="tab" data-t="stats" title="Analytics (5)">
            <span class="tab-ic">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 19.5h16" />
                <rect x="5.5" y="11.5" width="3" height="8" rx="1" />
                <rect x="10.5" y="6.5" width="3" height="13" rx="1" />
                <rect x="15.5" y="9" width="3" height="10.5" rx="1" />
              </svg>
            </span>
            <span class="tab-tx">Analytics</span>
          </button>
        </nav>
        <div class="tab-tools" id="tab-tools"></div>
      </div>
      <section class="sec on" id="sec-log"></section>
      <section class="sec" id="sec-plan"></section>
      <section class="sec" id="sec-workout"></section>
      <section class="sec" id="sec-personal"></section>
      <section class="sec" id="sec-stats"></section>
      <section class="sec" id="sec-settings"></section>
    </main>
    <script src="data/seed.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/formula-input.js"></script>
    <script src="js/state.js"></script>
    <script src="js/model.js"></script>
    <script src="js/page-shell.js"></script>
    <script src="js/pagination.js"></script>
    <script src="js/history-calendar.js"></script>
    <script src="js/ask.js"></script>
    <script src="js/workout-tab.js"></script>
    <script src="js/personal-tab.js"></script>
    <script src="js/view-dialog.js"></script>
    <script src="js/exercise-modal.js"></script>
    <script src="js/plan-tab.js"></script>
    <script src="js/template-modal.js"></script>
    <script src="js/log-tab.js"></script>
    <script src="js/workout-timer.js"></script>
    <script src="js/cycle-modal.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/about.js"></script>
    <script src="js/help.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/choice-menus.js"></script>
    <script src="js/shortcuts.js"></script>
    <script src="js/modal-bindings.js"></script>
    <script src="js/scroll-bars.js"></script>
    <script src="js/tab-swipe.js"></script>
    <script src="js/view-swipe.js"></script>
    <script src="script.js"></script>
  </body>
</html>
