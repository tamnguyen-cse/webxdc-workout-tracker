<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a70ff" />
      <stop offset=".5" stop-color="#5146e0" />
      <stop offset="1" stop-color="#2f20a8" />
    </linearGradient>
    <radialGradient id="glow" cx=".22" cy=".18" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".22" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spark-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd66b" stop-opacity=".55" />
      <stop offset="1" stop-color="#ffd66b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".6" stop-color="#f4f3ff" />
      <stop offset="1" stop-color="#dcd8ff" />
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a52" />
      <stop offset="1" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <rect width="256" height="256" fill="url(#bg)" />
  <rect width="256" height="256" fill="url(#glow)" />

  <ellipse cx="128" cy="220" rx="68" ry="8" fill="#140c5c" opacity=".28" />

  <g transform="rotate(-32 128 134)">
    <!-- protruding bar ends -->
    <rect x="26" y="123" width="204" height="22" rx="11" fill="#cfcbff" />
    <!-- orange accent handle grip -->
    <rect x="92" y="120" width="72" height="28" rx="9" fill="url(#grip)" />
    <path d="M108 126v16M122 126v16M136 126v16M150 126v16" stroke="#fff" stroke-opacity=".42"
      stroke-width="3.5" stroke-linecap="round" />

    <!-- outer smaller plates -->
    <rect x="38" y="96" width="24" height="76" rx="10" fill="#dcd8ff" />
    <rect x="194" y="96" width="24" height="76" rx="10" fill="#dcd8ff" />

    <!-- main white plates with lavender inner face shading -->
    <rect x="58" y="76" width="32" height="116" rx="13" fill="url(#plate)" />
    <rect x="82" y="84" width="8" height="100" rx="4" fill="#958dff" opacity=".45" />

    <rect x="166" y="76" width="32" height="116" rx="13" fill="url(#plate)" />
    <rect x="166" y="84" width="8" height="100" rx="4" fill="#958dff" opacity=".45" />

    <!-- crisp specular highlights on the plates -->
    <path d="M66 90v36M174 90v36" stroke="#ffffff" stroke-opacity=".85"
      stroke-width="4" stroke-linecap="round" />
  </g>

  <circle cx="204" cy="52" r="30" fill="url(#spark-glow)" />
  <path d="M204 30c1.7 12.6 9.2 20.1 21.8 21.8-12.6 1.7-20.1 9.2-21.8 21.8-1.7-12.6-9.2-20.1-21.8-21.8 12.6-1.7 20.1-9.2 21.8-21.8z"
    fill="#ffd66b" />
  <path d="M228 82c.6 4.4 3.2 7 7.6 7.6-4.4.6-7 3.2-7.6 7.6-.6-4.4-3.2-7-7.6-7.6 4.4-.6 7-3.2 7.6-7.6z"
    fill="#fff3c4" />
</svg>
